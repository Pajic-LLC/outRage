name: One-shot Runtime Refactor

on:
  push:
    branches: [feat/runtime-foundation]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'ci: apply runtime preparation refactor'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/runtime-foundation
          fetch-depth: 0

      - name: Unify runtime preparation
        shell: bash
        run: |
          cat > Sources/OutRageKit/LaunchSession.swift <<'SWIFT'
          import Foundation

          public struct LaunchSession: Equatable, Sendable {
              public let profile: RuntimeProfile
              public let plan: LaunchPlan
              public let command: LaunchCommand
              public let runtimeIdentifier: String?

              public init(
                  profile: RuntimeProfile,
                  plan: LaunchPlan,
                  command: LaunchCommand,
                  runtimeIdentifier: String?
              ) {
                  self.profile = profile
                  self.plan = plan
                  self.command = command
                  self.runtimeIdentifier = runtimeIdentifier
              }
          }

          public enum LaunchSessionBuilder {
              public static func prepare(
                  profile: RuntimeProfile,
                  paths: RuntimePaths = RuntimePaths(),
                  host: HostCapabilities = .current(),
                  fileManager: FileManager = .default
              ) throws -> LaunchSession {
                  try profile.validate()
                  try paths.ensureDirectories(fileManager: fileManager)
                  try paths.ensureTargetDirectories(for: profile.id, fileManager: fileManager)

                  let targetRoot = paths.targetURL(for: profile.id)
                  let prefixRoot = paths.prefixURL(for: profile.id)

                  if profile.runtime == .native {
                      let executableURL = paths.executableURL(for: profile)
                      guard fileManager.fileExists(atPath: executableURL.path) else {
                          throw LaunchSessionError.targetExecutableMissing(executableURL.path)
                      }

                      let plan = try LaunchPlanner.makePlan(
                          profile: profile,
                          targetRoot: targetRoot,
                          prefixRoot: prefixRoot,
                          host: host
                      )
                      let command = try LaunchCommandBuilder.make(plan: plan)
                      return LaunchSession(
                          profile: profile,
                          plan: plan,
                          command: command,
                          runtimeIdentifier: nil
                      )
                  }

                  let executableURL = paths.executableURL(for: profile)
                  let prepared = try RuntimeEnvironmentPreparer.prepare(
                      profile: profile,
                      executableForProbe: fileManager.fileExists(atPath: executableURL.path) ? executableURL : nil,
                      paths: paths,
                      host: host,
                      fileManager: fileManager
                  )

                  guard fileManager.fileExists(atPath: executableURL.path) else {
                      throw LaunchSessionError.targetExecutableMissing(executableURL.path)
                  }

                  var resolvedProfile = profile
                  resolvedProfile.cpu = prepared.cpu
                  resolvedProfile.graphics = prepared.graphics

                  let plan = try LaunchPlanner.makePlan(
                      profile: resolvedProfile,
                      targetRoot: targetRoot,
                      prefixRoot: prefixRoot,
                      host: host
                  )
                  var command = try LaunchCommandBuilder.make(
                      plan: plan,
                      runtime: prepared.installedRuntime.descriptor,
                      runtimeRoot: prepared.installedRuntime.rootURL,
                      context: prepared.context
                  )

                  if let targetFingerprint = try? TargetBuildFingerprint.inspect(
                      executableURL: executableURL,
                      fileManager: fileManager
                  ) {
                      let cacheFingerprint = RuntimeCacheFingerprint(
                          profileID: profile.id,
                          target: targetFingerprint,
                          runtimeIdentifier: prepared.installedRuntime.descriptor.id,
                          runtimeRevision: prepared.installedRuntime.descriptor.revision ?? 1,
                          graphicsBackend: prepared.graphics
                      )
                      let cache = try RuntimeCacheManager.prepare(
                          fingerprint: cacheFingerprint,
                          paths: paths,
                          fileManager: fileManager
                      )
                      command = PerformanceLaunchTuner.tune(command, cache: cache)
                  }

                  let diagnostics = LaunchDiagnosticsBuilder.make(
                      profile: profile,
                      executableURL: executableURL,
                      host: host,
                      runtime: prepared.installedRuntime.descriptor,
                      cpu: prepared.cpu,
                      graphics: prepared.graphics,
                      fileManager: fileManager
                  )
                  try? LaunchDiagnosticsBuilder.write(
                      diagnostics,
                      to: paths.diagnosticsURL(for: profile.id),
                      fileManager: fileManager
                  )

                  return LaunchSession(
                      profile: profile,
                      plan: plan,
                      command: command,
                      runtimeIdentifier: prepared.installedRuntime.descriptor.id
                  )
              }
          }

          public enum LaunchSessionError: Error, Equatable, CustomStringConvertible {
              case targetExecutableMissing(String)
              case runtimeExecutableMissing(String)

              public var description: String {
                  switch self {
                  case .targetExecutableMissing(let path):
                      return "Configured executable is missing: \(path)"
                  case .runtimeExecutableMissing(let path):
                      return "Runtime executable is missing or not executable: \(path)"
                  }
              }
          }
          SWIFT

          cat > Sources/OutRageKit/ManagedLauncherBootstrap.swift <<'SWIFT'
          import Foundation

          public enum ManagedLauncherBootstrap {
              public static func installedLauncherURL(
                  profile: RuntimeProfile,
                  paths: RuntimePaths = RuntimePaths()
              ) throws -> URL? {
                  let action = try AcquisitionPlanner.makePlan(profile: profile, paths: paths)
                  guard case let .managedLauncher(_, _, _, _, installedLauncherURL, _, _) = action else {
                      throw ManagedLauncherBootstrapError.wrongAcquisitionKind
                  }
                  return installedLauncherURL
              }

              public static func prepareInstaller(
                  profile: RuntimeProfile,
                  paths: RuntimePaths = RuntimePaths(),
                  fileManager: FileManager = .default
              ) async throws -> URL {
                  try paths.ensureDirectories(fileManager: fileManager)
                  try paths.ensureTargetDirectories(for: profile.id, fileManager: fileManager)

                  let action = try AcquisitionPlanner.makePlan(profile: profile, paths: paths)
                  guard case let .managedLauncher(
                      sourceURL,
                      expectedSHA256,
                      installerDestinationURL,
                      _,
                      _,
                      _,
                      _
                  ) = action else {
                      throw ManagedLauncherBootstrapError.wrongAcquisitionKind
                  }

                  if fileManager.fileExists(atPath: installerDestinationURL.path) {
                      if let expectedSHA256 {
                          if try FileDigest.verifySHA256(expectedSHA256, of: installerDestinationURL) {
                              return installerDestinationURL
                          }
                          try fileManager.removeItem(at: installerDestinationURL)
                      } else {
                          return installerDestinationURL
                      }
                  }

                  return try await ArtifactDownloader.download(
                      from: sourceURL,
                      to: installerDestinationURL,
                      expectedSHA256: expectedSHA256,
                      fileManager: fileManager
                  )
              }

              public static func makeInstallerCommand(
                  profile: RuntimeProfile,
                  installerURL: URL,
                  paths: RuntimePaths = RuntimePaths(),
                  host: HostCapabilities = .current(),
                  fileManager: FileManager = .default
              ) throws -> LaunchCommand {
                  let action = try AcquisitionPlanner.makePlan(profile: profile, paths: paths)
                  guard case let .managedLauncher(_, _, _, installerArguments, _, _, _) = action else {
                      throw ManagedLauncherBootstrapError.wrongAcquisitionKind
                  }

                  let prepared = try RuntimeEnvironmentPreparer.prepare(
                      profile: profile,
                      paths: paths,
                      host: host,
                      fileManager: fileManager
                  )
                  return try makeCommand(
                      profile: profile,
                      executableURL: installerURL,
                      arguments: installerArguments,
                      suffix: ".bootstrap",
                      prepared: prepared
                  )
              }

              public static func makeInstalledLauncherCommand(
                  profile: RuntimeProfile,
                  paths: RuntimePaths = RuntimePaths(),
                  host: HostCapabilities = .current(),
                  fileManager: FileManager = .default
              ) throws -> LaunchCommand {
                  let action = try AcquisitionPlanner.makePlan(profile: profile, paths: paths)
                  guard case let .managedLauncher(_, _, _, _, launcherURL, launcherArguments, _) = action else {
                      throw ManagedLauncherBootstrapError.wrongAcquisitionKind
                  }
                  guard let launcherURL else {
                      throw ManagedLauncherBootstrapError.launcherExecutableNotConfigured
                  }
                  guard fileManager.fileExists(atPath: launcherURL.path) else {
                      throw ManagedLauncherBootstrapError.launcherNotInstalled(launcherURL.path)
                  }

                  let prepared = try RuntimeEnvironmentPreparer.prepare(
                      profile: profile,
                      executableForProbe: launcherURL,
                      paths: paths,
                      host: host,
                      fileManager: fileManager
                  )
                  return try makeCommand(
                      profile: profile,
                      executableURL: launcherURL,
                      arguments: launcherArguments,
                      suffix: ".launcher",
                      prepared: prepared
                  )
              }

              private static func makeCommand(
                  profile: RuntimeProfile,
                  executableURL: URL,
                  arguments: [String],
                  suffix: String,
                  prepared: PreparedCompatibilityRuntime
              ) throws -> LaunchCommand {
                  let plan = LaunchPlan(
                      profileID: profile.id + suffix,
                      displayName: profile.displayName,
                      executableURL: executableURL,
                      workingDirectoryURL: executableURL.deletingLastPathComponent(),
                      runtime: .compatibility,
                      launcher: .managed,
                      cpu: prepared.cpu,
                      graphics: prepared.graphics,
                      arguments: arguments,
                      environment: profile.environment
                  )

                  return try LaunchCommandBuilder.make(
                      plan: plan,
                      runtime: prepared.installedRuntime.descriptor,
                      runtimeRoot: prepared.installedRuntime.rootURL,
                      context: prepared.context
                  )
              }
          }

          public enum ManagedLauncherBootstrapError: Error, Equatable, CustomStringConvertible {
              case wrongAcquisitionKind
              case compatibilityRuntimeRequired
              case launcherExecutableNotConfigured
              case launcherNotInstalled(String)

              public var description: String {
                  switch self {
                  case .wrongAcquisitionKind: return "Profile does not use managed launcher acquisition"
                  case .compatibilityRuntimeRequired: return "Managed launcher bootstrap requires a compatibility runtime"
                  case .launcherExecutableNotConfigured: return "Managed launcher executable is not configured"
                  case .launcherNotInstalled(let path): return "Managed launcher is not installed: \(path)"
                  }
              }
          }
          SWIFT

      - name: Fix signed profile tamper test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tests/OutRageKitTests/VerifiedProfileStoreTests.swift')
          text = path.read_text()
          old = '''    var tampered = envelopeData
              tampered.append(0x20)
              try tampered.write(
                  to: VerifiedProfileStore.envelopeURL(profileID: bundled.id, paths: paths),
                  options: .atomic
              )'''
          new = '''    var tamperedEnvelope = envelope
              tamperedEnvelope.signatureBase64 = Data("tampered-signature".utf8).base64EncodedString()
              try JSONEncoder().encode(tamperedEnvelope).write(
                  to: VerifiedProfileStore.envelopeURL(profileID: bundled.id, paths: paths),
                  options: .atomic
              )'''
          if old not in text:
              raise SystemExit('expected tamper-test block not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Harden runtime build validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tools/runtime/build-foss-metal-runtime.sh')
          text = path.read_text()
          marker = 'log "Signing staged engine"'
          if marker not in text:
              anchor = 'log "Extracting Metal backend"\n'
              replacement = '''log "Signing staged engine"
          bash "$REPO_ROOT/Tools/runtime/sign-runtime-tree.sh" "$ENGINE_ROOT"

          log "Executing Windows PE smoke target"
          bash "$REPO_ROOT/Tools/runtime/smoke-windows-runtime.sh" "$ENGINE_ROOT"

          log "Extracting Metal backend"
          '''
              if anchor not in text:
                  raise SystemExit('engine validation insertion point missing')
              text = text.replace(anchor, replacement, 1)

          marker2 = 'log "Signing Metal backend"'
          if marker2 not in text:
              anchor2 = 'tar -xzf "$DXMT_ARCHIVE" -C "$DXMT_ROOT"\n\nlog "Composing and packaging runtime"'
              replacement2 = '''tar -xzf "$DXMT_ARCHIVE" -C "$DXMT_ROOT"

          log "Signing Metal backend"
          bash "$REPO_ROOT/Tools/runtime/sign-runtime-tree.sh" "$DXMT_ROOT"

          log "Composing and packaging runtime"'''
              if anchor2 not in text:
                  raise SystemExit('backend signing insertion point missing')
              text = text.replace(anchor2, replacement2, 1)

          marker3 = 'packaged-runtime-validation: invoking'
          if marker3 not in text:
              anchor3 = 'log "Runtime package complete"\n'
              replacement3 = '''log "Validating packaged runtime" # packaged-runtime-validation: invoking
          PACKAGE_ARCHIVE="$(find "$OUTPUT" -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          [[ -n "$PACKAGE_ARCHIVE" ]] || die "runtime package archive was not produced"
          bash "$REPO_ROOT/Tools/runtime/validate-packaged-runtime-portable.sh" "$PACKAGE_ARCHIVE"

          log "Runtime package complete"
          '''
              if anchor3 not in text:
                  raise SystemExit('package validation insertion point missing')
              text = text.replace(anchor3, replacement3, 1)
          path.write_text(text)
          PY

          rm -f Tools/runtime/validate-packaged-runtime.sh

      - name: Validate refactor
        shell: bash
        run: |
          bash -n Tools/runtime/build-foss-metal-runtime.sh
          bash -n Tools/runtime/build-validated-foss-metal-runtime.sh
          bash -n Tools/runtime/sign-runtime-tree.sh
          bash -n Tools/runtime/smoke-windows-runtime.sh
          bash -n Tools/runtime/smoke-d3d11-runtime.sh
          bash -n Tools/runtime/validate-runtime-tree.sh
          bash -n Tools/runtime/validate-packaged-runtime-portable.sh
          swift test
          swift build -c release --product outrage --product outrage-host

      - name: Push tested refactor
        shell: bash
        run: |
          git config user.name "outRage CI"
          git config user.email "actions@users.noreply.github.com"
          git add Sources Tests Tools
          if git diff --cached --quiet; then
            echo "No refactor changes to commit"
          else
            git commit -m "refactor: unify runtime preparation and validation"
            git push origin HEAD:feat/runtime-foundation
          fi
          git push origin --delete scratch/do-not-use || true
