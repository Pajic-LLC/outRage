name: Runtime Build

on:
  workflow_dispatch:
  push:
    branches: [feat/runtime-foundation]
    paths:
      - Tools/runtime/build-foss-metal-runtime.sh
      - .github/workflows/runtime-build.yml

permissions:
  contents: read

concurrency:
  group: runtime-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build verified FOSS Metal runtime
        run: |
          bash Tools/runtime/build-foss-metal-runtime.sh \
            --install-deps \
            --output "$RUNNER_TEMP/runtime-packages"
      - name: Verify packaged runtime
        run: |
          ARCHIVE="$(find "$RUNNER_TEMP/runtime-packages" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          MANIFEST="$(find "$RUNNER_TEMP/runtime-packages" -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"
          test -n "$ARCHIVE"
          test -n "$MANIFEST"
          swift run -c release outrage runtime-install "$ARCHIVE" "$MANIFEST"
      - name: Inspect package
        run: |
          ls -lah "$RUNNER_TEMP/runtime-packages"
          shasum -a 256 "$RUNNER_TEMP/runtime-packages"/*
      - name: Upload runtime package
        uses: actions/upload-artifact@v7
        with:
          name: outrage-foss-metal-runtime
          path: ${{ runner.temp }}/runtime-packages/
          retention-days: 7
