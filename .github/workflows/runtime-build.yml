name: Runtime Build

on:
  workflow_dispatch:
  push:
    branches: [feat/runtime-foundation]
    paths:
      - Tools/runtime/**
      - '!Tools/runtime/test-*'
      - .github/workflows/runtime-build.yml

permissions:
  contents: read

concurrency:
  group: runtime-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Test dependency architecture preflight
        run: python3 Tools/runtime/test-verify-runtime-deps.py
      - name: Identify dependency build toolchain
        id: toolchain
        run: |
          KEY="$( { xcrun clang --version; xcrun --show-sdk-path; printf '%s\n' "$GITHUB_WORKSPACE"; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Restore pinned dependency prefix
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: .build/runtime-foss/dependencies/prefix
          key: macos15-${{ runner.arch }}-deps-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Tools/runtime/build-x86_64-runtime-deps.sh') }}
      - name: Build pinned launcher dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          bash Tools/runtime/build-x86_64-runtime-deps.sh \
            --work "$GITHUB_WORKSPACE/.build/runtime-foss/dependencies" \
            --prefix "$GITHUB_WORKSPACE/.build/runtime-foss/dependencies/prefix"
      - name: Verify pinned dependency prefix
        run: bash Tools/runtime/verify-runtime-deps.sh "$GITHUB_WORKSPACE/.build/runtime-foss/dependencies/prefix"
      - name: Save verified dependency prefix before engine build
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build/runtime-foss/dependencies/prefix
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build verified FOSS Metal runtime
        run: |
          bash Tools/runtime/build-foss-metal-runtime.sh \
            --install-deps \
            --dependency-prefix "$GITHUB_WORKSPACE/.build/runtime-foss/dependencies/prefix" \
            --output "$RUNNER_TEMP/runtime-packages"
      - name: Install packaged runtime
        run: |
          ARCHIVE="$(find "$RUNNER_TEMP/runtime-packages" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          MANIFEST="$(find "$RUNNER_TEMP/runtime-packages" -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"
          test -n "$ARCHIVE"
          test -n "$MANIFEST"
          swift run -c release outrage runtime-install "$ARCHIVE" "$MANIFEST"
      - name: Audit runtime self-containment
        run: |
          RUNTIME_ROOT="$(swift run -c release outrage runtimes | awk -F '\t' '$1 == "outrage-metal-x86_64" { print $2; exit }')"
          test -n "$RUNTIME_ROOT"
          bash Tools/runtime/audit-runtime-dylibs.sh "$RUNTIME_ROOT"
      - name: Smoke-test DXMT initialization
        run: swift run -c release outrage runtime-smoke-dxmt outrage-metal-x86_64
      - name: Smoke-test D3D11 device creation
        run: |
          RUNTIME_ROOT="$(swift run -c release outrage runtimes | awk -F '\t' '$1 == "outrage-metal-x86_64" { print $2; exit }')"
          test -n "$RUNTIME_ROOT"
          bash Tools/runtime/smoke-d3d11-runtime.sh "$RUNTIME_ROOT"
      - name: Smoke-test Windows execution
        run: bash Tools/runtime/smoke/verify-installed-runtime.sh outrage-metal-x86_64
      - name: Inspect package
        run: |
          ls -lah "$RUNNER_TEMP/runtime-packages"
          shasum -a 256 "$RUNNER_TEMP/runtime-packages"/*
      - name: Upload runtime package
        uses: actions/upload-artifact@v7
        with:
          name: outrage-foss-metal-runtime
          path: ${{ runner.temp }}/runtime-packages/
          retention-days: 7
      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-build-failure-logs
          path: |
            .build/runtime-foss/*.log
            .build/runtime-foss/dependencies/*.log
          if-no-files-found: ignore
          retention-days: 7
