name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Validate runtime build scripts
        run: bash -n Tools/runtime/build-foss-metal-runtime.sh
      - name: Test
        run: swift test
      - name: Build release tools
        run: swift build -c release --product outrage --product outrage-host
