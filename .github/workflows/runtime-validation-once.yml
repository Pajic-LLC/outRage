name: Runtime Validation

on:
  push:
    branches: [feat/runtime-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: validate signed FOSS runtime package'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Validate runtime scripts
        run: |
          bash -n Tools/runtime/build-foss-metal-runtime.sh
          bash -n Tools/runtime/build-validated-foss-metal-runtime.sh
          bash -n Tools/runtime/sign-runtime-tree.sh
          bash -n Tools/runtime/smoke-windows-runtime.sh
          bash -n Tools/runtime/validate-runtime-tree.sh
      - name: Build, sign, smoke-test and package runtime
        run: |
          bash Tools/runtime/build-validated-foss-metal-runtime.sh \
            --install-deps \
            --output "$RUNNER_TEMP/runtime-packages"
      - name: Inspect package
        run: |
          ls -lah "$RUNNER_TEMP/runtime-packages"
          shasum -a 256 "$RUNNER_TEMP/runtime-packages"/*
      - name: Upload validated runtime
        uses: actions/upload-artifact@v7
        with:
          name: outrage-validated-foss-metal-runtime
          path: ${{ runner.temp }}/runtime-packages/
          retention-days: 7
